<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RoadOptimizur — Planification & tournées</title>
  <meta name="description" content="Planificateur de tournées multi-conducteurs, preuve de livraison et suivi client. 100 % local.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RoadOptimizur">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M14 40h22l6-10h8v14H14z' fill='%230ea5e9'/%3E%3Ccircle cx='22' cy='46' r='5' fill='%23fff'/%3E%3Ccircle cx='44' cy='46' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
              800: '#075985', 900: '#0c4a6e'
            }
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { height: 100%; }
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    input, select, textarea { font-size: 16px; }
    @media (min-width: 768px) { input, select, textarea { font-size: 0.875rem; } }

    #map { height: 100%; width: 100%; z-index: 0; background: #e2e8f0; }
    .leaflet-container { font-family: inherit; }
    .leaflet-popup-content { font-size: 12px; line-height: 1.35; }
    .leaflet-control-attribution { font-size: 9px; }

    /* Marqueurs */
    .ro-marker { background: transparent; border: 0; }
    .ro-pin {
      --pin: #0284c7;
      background: var(--pin);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(15, 23, 42, .35);
      transform: translateY(-2px);
    }
    .ro-pin-depot {
      width: 34px; height: 34px;
      background: #f59e0b;
      border-radius: 10px;
      font-size: 14px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Safe area iOS */
    .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: env(safe-area-inset-top); }

    /* Onglets */
    .tab-active {
      color: #0369a1 !important;
      background: #e0f2fe;
      border-color: #7dd3fc !important;
      font-weight: 800;
    }

    /* Carte mobile : tiroir escamotable — masquée par défaut, le contenu prend tout l'écran */
    .map-shell { height: 0; overflow: hidden; border-bottom-width: 0; transition: height .25s ease; }
    body.map-open .map-shell { height: 46dvh; border-bottom-width: 1px; }
    @media (min-width: 768px) { .map-shell { height: auto; flex: 1 1 auto; overflow: visible; } }

    /* Lisibilité tactile mobile : textes et zones de touch agrandis (!important gagne sur le CDN Tailwind)
       2ᵉ branche : téléphone resté en « site desktop » (Chrome force ~980 px) — pointer:coarse le rattrape */
    @media (max-width: 767px), (pointer: coarse) and (max-width: 1100px) {
      .map-shell { height: 0 !important; flex: 0 0 auto !important; width: 100% !important; border: 0 !important; overflow: hidden; }
      body.map-open .map-shell { height: 46dvh !important; border-bottom: 1px solid #e2e8f0 !important; }
      #planner-view section { width: 100% !important; flex: 1 1 auto !important; }
      header .sm\:hidden { display: flex !important; }
      header div.hidden.sm\:flex:has(#active-date) { display: none !important; }
      #planner-view button, #planner-view a[role="button"] { min-height: 44px; }
      #planner-view .text-xs { font-size: 13.5px !important; line-height: 1.35; }
      #planner-view .text-\\[11px\\], #planner-view .text-\\[10px\\] { font-size: 12.5px !important; line-height: 1.35; }
      #planner-view .text-sm { font-size: 15px !important; }
      #planner-view .font-semibold, #planner-view .font-bold { letter-spacing: .01em; }
      #planner-view .min-h-\\[36px\\] { min-height: 44px !important; }
      #planner-view .rounded-xl .flex.items-center.gap-2 span, #planner-view .truncate { font-size: 13.5px !important; }
      #planner-tabs button { min-height: 46px !important; font-size: 13.5px !important; padding: 0 14px !important; }
      header button, header label { min-width: 44px; }
    }

    /* Impression */
    .print-only { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      .no-print, header.no-print, #planner-view, #view-driver, #view-track, #view-feedback, #modal-root, #toast-root { display: none !important; }
      .print-only { display: block !important; }
      .print-page { break-after: page; }
      .print-page:last-child { break-after: auto; }
      .break-inside-avoid { break-inside: avoid; }
      .bg-slate-900, .bg-brand-600, .bg-emerald-600 { color: #000 !important; background: #fff !important; }
    }
  </style>
</head>
<body class="h-full font-sans text-slate-800 antialiased overflow-hidden bg-slate-100">

  <!-- ============================ PLANIFICATEUR ============================ -->
  <div id="planner-view" class="h-dvh flex flex-col overflow-hidden">
    <header class="bg-slate-900 text-white shadow-lg z-30 flex-shrink-0 no-print">
      <div class="px-3 sm:px-4 py-2 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-truck-fast text-base"></i>
          </div>
          <div class="min-w-0">
            <h1 class="font-extrabold text-sm sm:text-base leading-tight truncate">RoadOptimizur</h1>
            <p class="text-[10px] text-slate-400 hidden sm:block">Planification & preuve de livraison</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-shrink-0">
          <div class="hidden sm:flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-lg px-2 h-10">
            <i class="fa-regular fa-calendar text-[11px] text-slate-400"></i>
            <input id="active-date" type="date" class="bg-transparent text-xs text-slate-100 outline-none w-[125px]">
          </div>
          <button id="btn-export" type="button" class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 active:bg-slate-700 flex items-center justify-center" title="Exporter en JSON">
            <i class="fa-solid fa-download"></i>
          </button>
          <label class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 active:bg-slate-700 flex items-center justify-center cursor-pointer" title="Importer JSON ou CSV">
            <i class="fa-solid fa-upload"></i>
            <input id="global-import" type="file" accept=".json,.csv,application/json,text/csv" class="hidden">
          </label>
          <button id="btn-print" type="button" class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 active:bg-slate-700 flex items-center justify-center" title="Imprimer">
            <i class="fa-solid fa-print"></i>
          </button>
          <span id="user-chip" class="hidden md:flex items-center gap-1.5 h-10 px-3 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 text-xs font-bold" hidden></span>
          <button id="btn-install" type="button" class="hidden sm:flex w-10 h-10 rounded-lg bg-brand-600 text-white active:bg-brand-700 items-center justify-center" title="Installer l’application">
            <i class="fa-solid fa-mobile-screen-button"></i>
          </button>
        </div>
      </div>

      <div class="sm:hidden px-3 pb-2 flex items-center gap-2">
        <div class="flex-1 flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-2 h-11">
          <i class="fa-regular fa-calendar text-[13px] text-slate-400"></i>
          <input id="active-date-mobile" type="date" class="bg-transparent text-[14px] text-slate-100 outline-none flex-1 min-w-0">
        </div>
        <button id="btn-map-toggle" type="button" class="flex-shrink-0 h-11 px-4 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 text-[13px] font-bold flex items-center gap-2 active:bg-slate-700" title="Afficher / masquer la carte" aria-pressed="false">
          <i class="fa-solid fa-map-location-dot"></i> Carte
        </button>
      </div>

      <nav id="planner-tabs" class="flex overflow-x-auto px-2 pb-2 gap-1" aria-label="Sections">
        <button type="button" data-tab="stops" class="tab-active flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check"></i> Commandes
        </button>
        <button type="button" data-tab="drivers" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-id-card"></i> Conducteurs
        </button>
        <button type="button" data-tab="routes" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-route"></i> Tournées
        </button>
        <button type="button" data-tab="planning" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-days"></i> Planning
        </button>
        <button type="button" data-tab="analytics" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-chart-line"></i> Analytique
        </button>
        <button type="button" data-tab="settings" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders"></i> Réglages
        </button>
        <button type="button" data-tab="accounts" class="flex-shrink-0 min-h-[36px] px-3 rounded-lg text-[11px] font-bold text-slate-500 bg-slate-800/60 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-user-shield"></i> Comptes
        </button>
      </nav>
    </header>

    <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">
      <aside class="map-shell w-full md:w-auto md:flex-1 relative order-first md:order-last flex-shrink-0 border-b md:border-b-0 md:border-l border-slate-200">
        <div id="map"></div>
        <div class="absolute top-2 right-2 z-[400] bg-white/90 backdrop-blur rounded-lg shadow px-2 py-1 text-[10px] text-slate-600 pointer-events-none">
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-brand-600"></span> tournée</span>
          <span class="inline-flex items-center gap-1 ml-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span> dépôt</span>
        </div>
      </aside>

      <section class="flex-1 md:w-[540px] md:flex-none min-h-0 overflow-y-auto bg-slate-100 order-last md:order-first">
        <div id="panel" class="pb-10"></div>
        <p class="text-center text-[10px] text-slate-400 pb-4">
          <span id="save-state">Enregistré</span> · RoadOptimizur v3 · <span class="text-slate-400">100 % local</span>
        </p>
      </section>
    </div>
  </div>

  <!-- ============================ VUES SECONDAIRES ============================ -->
  <div id="view-driver" class="hidden"></div>
  <div id="view-track" class="hidden"></div>
  <div id="view-feedback" class="hidden"></div>

  <!-- Zone d'impression -->
  <div id="print-area" class="print-only"></div>

  <!-- Modales & notifications -->
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed inset-x-0 bottom-24 md:bottom-6 z-[200] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <noscript>
    <div class="fixed inset-0 bg-white z-[999] flex items-center justify-center p-6 text-center">
      <p class="text-sm text-slate-700">RoadOptimizur nécessite JavaScript pour fonctionner.</p>
    </div>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
